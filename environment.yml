# Reproducible environment for this repository.
#   conda env create -f environment.yml && conda activate aiida-6p25
name: aiida-6p25
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - aiida-core==2.8.0
      - aiida-quantumespresso==5.0.0
      - aiida-common-workflows==1.0.1
      - aiida-pseudo==1.7.2
      - aiida-submission-controller==0.1.2
      - numpy>=1.24
      - scipy>=1.10
      - matplotlib>=3.7
      - pyyaml>=6.0
